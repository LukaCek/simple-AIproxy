name: Deploy FastAPI LLM Proxy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: simple-aiproxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy config.yml and app.db for testing
        run: |
          cat > config.yml << EOF
          providers: []
          groups: {}
          EOF
          touch app.db

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff
          ruff check --ignore BLE001,RUF100 main.py free_model_registry.py tests/test_proxy.py tests/test_free_model_registry.py
          pytest -q

      - name: Real Docker production rollback fault injection
        run: bash tests/release_docker_fault_injection.sh

      - name: Start services with docker compose
        run: docker compose up -d

      - name: Wait for server to be healthy
        run: |
          echo "Waiting for server to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000 > /dev/null 2>&1; then
              echo "Server is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - server not ready yet, waiting..."
            sleep 2
          done
          echo "Server health check failed!"
          docker compose logs
          exit 1

      - name: Clean up
        if: always()
        run: docker compose down -v

  # Native architectures compile in parallel and preserve their own caches.
  # DO NOT update the live :latest tag from either individual architecture.
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native ${{ matrix.arch }} by immutable digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/lukacek/simple-aiproxy,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=simpleai-proxy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=simpleai-proxy-${{ matrix.arch }}
      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: proxy-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify native manifests before moving latest
        env:
          IMAGE: ghcr.io/lukacek/simple-aiproxy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          shopt -s nullglob
          digests=( * )
          [[ "${#digests[@]}" -eq 2 ]] || {
            echo "Both AMD64 and ARM64 digests are required."
            exit 1
          }
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=( "$IMAGE@sha256:$digest" )
          done
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_SHA" | python3 -c '
          import json,sys
          obj=json.load(sys.stdin)
          arches={(m["platform"]["os"],m["platform"]["architecture"])
                  for m in obj["manifests"] if m.get("platform")}
          required={("linux","amd64"),("linux","arm64")}
          assert required <= arches, (required,arches)
          '
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:latest"

  deploy:
    needs: publish-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync production Docker Compose and update script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "server_deployment/docker-compose.yml,server_deployment/update.sh,server_deployment/backup_release.py,server_deployment/check_release.py"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH and verify health and admin UI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x update.sh
            ./update.sh

  report:
    needs: [test, build-and-push, publish-image, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pipeline result
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          PUBLISH_RESULT: ${{ needs.publish-image.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          git config user.name "SimpleAIProxy Deploy Bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git fetch origin deployment-status
          git switch deployment-status
          REPORTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "${DEPLOY_RESULT}" = "success" ]; then
            STATUS="verified"
            DEPLOYED_SHA="${COMMIT_SHA}"
            FASTAPI_HEALTH=true
            ADMIN_CONFIG_UI=true
          else
            STATUS="failed"
            DEPLOYED_SHA=""
            FASTAPI_HEALTH=false
            ADMIN_CONFIG_UI=false
          fi
          cat > deployment-status.json <<EOF
          {
            "status": "${STATUS}",
            "commit_sha": "${COMMIT_SHA}",
            "deployed_sha": "${DEPLOYED_SHA}",
            "reported_at": "${REPORTED_AT}",
            "workflow_run_url": "https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}",
            "jobs": {
              "test": "${TEST_RESULT}",
              "build_and_push": "${BUILD_RESULT}",
              "publish_image": "${PUBLISH_RESULT}",
              "deploy": "${DEPLOY_RESULT}"
            },
            "checks": {
              "fastapi_health": ${FASTAPI_HEALTH},
              "admin_config_free_provider_ui": ${ADMIN_CONFIG_UI}
            }
          }
          EOF
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record deployment pipeline ${COMMIT_SHA}"
          git push origin deployment-status
