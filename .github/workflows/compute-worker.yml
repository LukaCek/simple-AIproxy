name: SimpleAI Compute Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "compute_catalog.py"
      - "compute_worker_snapshot.py"
      - "tests/test_compute_worker_tui.py"
      - "compute_worker_storage.py"
      - "compute_plane.py"
      - "compute_scheduler.py"
      - "compute_placement.py"
      - "compute_setup.py"
      - "templates/compute_setup.html"
      - "templates/compute_nodes.html"
      - "tests/test_compute_placement.py"
      - "tests/test_compute_setup.py"
      - "tests/test_compute_scheduler.py"
      - "tests/test_zz_compute_plane.py"
      - "tests/test_worker_agent.py"
      - "tests/test_compute_worker_storage.py"
      - "tests/test_oblak_compose.py"
      - "compute_staging_smoke.py"
      - "compute_staging_auto_smoke.py"
      - "tests/compute_streaming_check.py"
      - ".github/workflows/compute-worker.yml"
      - "deploy/**"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "compute_catalog.py"
      - "compute_plane.py"
      - ".github/workflows/compute-worker.yml"
  workflow_dispatch:

concurrency:
  group: compute-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax and test control plane
        run: |
          python -m compileall -q compute_catalog.py compute_worker_storage.py compute_plane.py compute_scheduler.py compute_placement.py compute_setup.py compute_worker_snapshot.py worker/agent.py worker/tui.py compute_staging_smoke.py compute_staging_auto_smoke.py
          python -m pip install -r requirements.txt -r worker/requirements.txt pytest
          pytest -q tests/test_zz_compute_plane.py tests/test_worker_agent.py tests/test_compute_worker_storage.py tests/test_oblak_compose.py tests/test_compute_scheduler.py tests/test_compute_placement.py tests/test_compute_setup.py tests/test_compute_worker_tui.py
          pytest -q tests/compute_streaming_check.py
          python -m worker.tui --once > /tmp/simpleai-tui-snapshot.txt
          grep -q 'Compute Worker' /tmp/simpleai-tui-snapshot.txt
          docker compose --env-file worker/.env.example -f worker/docker-compose.yml config --quiet
          docker compose --env-file deploy/compute-staging.env.example -f deploy/compute-staging.compose.yml config --quiet
          docker compose -f deploy/oblak-test-proxy-worker/docker-compose.yml config --quiet
          docker compose -f deploy/home-compute-test.compose.yml config --quiet
          # Validate resolved paths, not just Compose syntax. Relative build
          # contexts resolve from deploy/, not the shell's working directory.
          docker compose -f deploy/home-compute-test.compose.yml config --format json | python -c 'import json,pathlib,sys; cfg=json.load(sys.stdin); root=pathlib.Path.cwd().resolve(); assert all(pathlib.Path(cfg["services"][service]["build"]["context"]).resolve()==root for service in ("proxy","worker")), "Home test build context does not resolve to repository root"'

  # PR builds run on *native* independent machines, in parallel with Python tests.
  # This avoids emulating ARM64 through QEMU during the llama.cpp C++ build.
  docker-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a native architecture
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Wrong runner architecture"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - name: Build worker for ${{ matrix.arch }} (no emulation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=worker-${{ matrix.arch }}
          cache-to: type=gha,scope=worker-${{ matrix.arch }},mode=max

  # Publish one image digest per native architecture. The final manifest is
  # assembled only after both independent builds have passed.
  build-worker:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require a native architecture
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Wrong runner architecture"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish worker digest for ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/lukacek/simple-aiproxy-worker
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=worker-${{ matrix.arch }}
          cache-to: type=gha,scope=worker-${{ matrix.arch }},mode=max
      - name: Save image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-worker:
    needs: build-worker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/lukacek/simple-aiproxy-worker
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: worker-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture latest and SHA tags
        shell: bash
        run: |
          cd "${{ runner.temp }}/digests"
          shopt -s nullglob
          files=(*)
          [[ "${#files[@]}" -eq 2 ]] || { echo "Expected two native build digests"; exit 1; }
          images=()
          for file in "${files[@]}"; do
            [[ "$file" =~ ^[0-9a-f]{64}$ ]] || exit 1
            images+=("${REGISTRY_IMAGE}@sha256:${file}")
          done
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            -t "${REGISTRY_IMAGE}:${GITHUB_SHA}" \
            "${images[@]}"
      - name: Verify final image includes both architectures
        shell: bash
        run: |
          docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:${GITHUB_SHA}" | python3 -c '
          import json, sys
          image = json.load(sys.stdin)
          platforms = {
              (m.get("platform", {}).get("os"), m.get("platform", {}).get("architecture"))
              for m in image.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          print("Published image platforms:", platforms)
          if not required.issubset(platforms):
              sys.exit("Multi-architecture manifest is missing a required platform")
          '
