name: SimpleAI Compute Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "compute_catalog.py"
      - "compute_worker_snapshot.py"
      - "codex_registry.py"
      - "tests/test_codex_registry.py"
      - "tests/test_compute_worker_tui.py"
      - "tests/test_worker_build_pipeline.py"
      - "tests/test_compute_playground.py"
      - "templates/playground.html"
      - "main_impl.py"
      - "compute_worker_storage.py"
      - "compute_plane.py"
      - "responses_streaming_entrypoint.py"
      - "compute_scheduler.py"
      - "compute_placement.py"
      - "compute_setup.py"
      - "templates/compute_setup.html"
      - "templates/compute_nodes.html"
      - "tests/test_compute_placement.py"
      - "tests/test_compute_setup.py"
      - "tests/test_compute_scheduler.py"
      - "tests/test_zz_compute_plane.py"
      - "tests/test_worker_agent.py"
      - "tests/test_compute_worker_storage.py"
      - "tests/test_oblak_compose.py"
      - "compute_staging_smoke.py"
      - "compute_staging_auto_smoke.py"
      - "tests/compute_streaming_check.py"
      - ".github/workflows/compute-worker.yml"
      - "deploy/**"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - "tests/test_worker_build_pipeline.py"
      - "worker/**"
      - "compute_catalog.py"
      - "compute_plane.py"
      - ".github/workflows/compute-worker.yml"
  workflow_dispatch:

concurrency:
  group: compute-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax and test control plane
        run: |
          python -m compileall -q compute_catalog.py compute_worker_storage.py compute_plane.py compute_scheduler.py compute_placement.py compute_setup.py compute_worker_snapshot.py worker/agent.py worker/tui.py compute_staging_smoke.py compute_staging_auto_smoke.py
          bash -n worker/install.sh
          bash -n worker/auto-update.sh
          python -m pip install -r requirements.txt -r worker/requirements.txt pytest pytest-asyncio
          pytest -q tests/test_zz_compute_plane.py tests/test_worker_agent.py tests/test_compute_worker_storage.py tests/test_oblak_compose.py tests/test_compute_scheduler.py tests/test_compute_placement.py tests/test_compute_setup.py tests/test_compute_worker_tui.py tests/test_worker_build_pipeline.py
          pytest -q tests/test_compute_playground.py
          # The production full_entrypoint installs a Codex-aware /v1/models
          # replacement; exercise it to prevent silently losing local models.
          pytest -q tests/test_codex_registry.py
          pytest -q tests/compute_streaming_check.py
          python -m worker.tui --once > /tmp/simpleai-tui-snapshot.txt
          grep -q 'Compute Worker' /tmp/simpleai-tui-snapshot.txt
          docker compose --env-file worker/.env.example -f worker/docker-compose.yml config --quiet
          docker compose --env-file deploy/compute-staging.env.example -f deploy/compute-staging.compose.yml config --quiet
          docker compose -f deploy/oblak-test-proxy-worker/docker-compose.yml config --quiet
          docker compose -f deploy/home-compute-test.compose.yml config --quiet
          # Validate resolved paths, not just Compose syntax. Relative build
          # contexts resolve from deploy/, not the shell's working directory.
          docker compose -f deploy/home-compute-test.compose.yml config --format json | python -c 'import json,pathlib,sys; cfg=json.load(sys.stdin); root=pathlib.Path.cwd().resolve(); assert all(pathlib.Path(cfg["services"][service]["build"]["context"]).resolve()==root for service in ("proxy","worker")), "Home test build context does not resolve to repository root"'

  docker-smoke:
    needs: verify
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: docker-smoke (${{ matrix.arch }} native)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native ${{ matrix.arch }} worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: WORKER_BUILD_REVISION=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=compute-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=compute-worker-${{ matrix.arch }}

  # Build each architecture on a native runner, not through QEMU.
  # Reuse the same per-architecture cache scopes as PR smoke tests.
  build-worker:
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: build-worker (${{ matrix.arch }} native)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }} by immutable digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: WORKER_BUILD_REVISION=${{ github.sha }}
          # Do not move :latest until BOTH architectures pass.
          outputs: type=image,name=ghcr.io/lukacek/simple-aiproxy-worker,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=compute-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=compute-worker-${{ matrix.arch }}
      - name: Save platform digest for manifest assembly
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Update public release tags atomically only when both native jobs succeed.
  publish-worker:
    needs: build-worker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 release manifests
        env:
          IMAGE: ghcr.io/lukacek/simple-aiproxy-worker
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          shopt -s nullglob
          digests=( * )
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected TWO native platform digests; refusing to update latest."
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=( "$IMAGE@sha256:$digest" )
          done
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$GITHUB_SHA" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
          # Fail if either architecture is missing.
          docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_SHA" | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          platforms = {(x["platform"]["os"], x["platform"]["architecture"])
                       for x in m["manifests"] if x.get("platform")}
          assert {("linux", "amd64"), ("linux", "arm64")} <= platforms, platforms
          '
