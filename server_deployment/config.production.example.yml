# Production starter config for ~/docker/simple-AIproxy/config.yml
# Keep real tokens only on the server. Never commit real access_token/refresh_token values.
#
# The dynamic "free-models" group is injected at runtime from the public registry.
# Manage its named credentials under Admin -> Config -> Free provider API keys or
# through provider environment variables in .env; do not add a static free-models
# group here just to enable the registry.
#
# Runtime timeout/cooldown/audio tuning belongs in .env. See .env.example and
# PRODUCTION_SETUP.md.

providers:
  - name: codex-a
    url: https://chatgpt.com/backend-api/codex
    description: First OpenAI Codex OAuth profile
    models:
      - gpt-5.5
    api_mode: codex_responses
    oauth: true
    client_id: app_EMoamEEZ73f0CkXaXp7hrann
    token_url: https://auth.openai.com/oauth/token
    access_token: "PASTE_CODEX_A_ACCESS_TOKEN_HERE"
    refresh_token: "PASTE_CODEX_A_REFRESH_TOKEN_HERE"
    expires_at: ""

  - name: codex-b
    url: https://chatgpt.com/backend-api/codex
    description: Second OpenAI Codex OAuth profile
    models:
      - gpt-5.5
    api_mode: codex_responses
    oauth: true
    client_id: app_EMoamEEZ73f0CkXaXp7hrann
    token_url: https://auth.openai.com/oauth/token
    access_token: "PASTE_CODEX_B_ACCESS_TOKEN_HERE"
    refresh_token: "PASTE_CODEX_B_REFRESH_TOKEN_HERE"
    expires_at: ""

  # Optional OpenAI-compatible transcription provider. The secret is read
  # from GROQ_API_KEY in .env; clients still authenticate only to AIProxy.
  - name: groq-transcription
    url: https://api.groq.com/openai/v1
    description: Groq Whisper speech transcription
    models:
      - whisper-large-v3-turbo
      - whisper-large-v3
    api_key: ""
    api_key_env: GROQ_API_KEY
    api_mode: openai_audio_transcriptions

  # Optional local Ollama through its OpenAI-compatible endpoint.
  # This only works if the container can reach Ollama at this host.
  - name: ollama-local
    url: http://host.docker.internal:11434
    description: Ollama OpenAI-compatible endpoint
    models:
      - llama3.2
    api_key: ""
    api_mode: openai_chat_completions

groups:
  gpt-5.5:
    description: Balanced Codex pool for Hermes/OpenAI-compatible clients
    strategy: round_robin
    members:
      - provider: codex-a
        model: gpt-5.5
      - provider: codex-b
        model: gpt-5.5

  local-llama:
    description: Optional local Ollama model
    strategy: fallback
    members:
      - provider: ollama-local
        model: llama3.2

notifications:
  ntfy:
    enabled: true
    url: https://ntfy.cekluka.com/aiproxy
    username: ""
    password: ""
    check_interval_seconds: 300
    failure_threshold: 2
    notify_recovery: true
