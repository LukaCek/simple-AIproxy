name: Deploy FastAPI LLM Proxy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: simple-aiproxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy config.yml and app.db for testing
        run: |
          cat > config.yml << EOF
          providers: []
          groups: {}
          EOF
          touch app.db

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff
          ruff check --ignore BLE001,RUF100 main.py free_model_registry.py tests/test_proxy.py tests/test_free_model_registry.py
          pytest -q

      - name: Start services with docker compose
        run: docker compose up -d

      - name: Wait for server to be healthy
        run: |
          echo "Waiting for server to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000 > /dev/null 2>&1; then
              echo "Server is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - server not ready yet, waiting..."
            sleep 2
          done
          echo "Server health check failed!"
          docker compose logs
          exit 1

      - name: Clean up
        if: always()
        run: docker compose down -v

  # Exercise both architectures natively on pull requests, concurrently with tests.
  proxy-docker-smoke:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Require native architecture
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Wrong runner architecture"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - name: Build proxy for ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=proxy-${{ matrix.arch }}
          cache-to: type=gha,scope=proxy-${{ matrix.arch }},mode=max

  # Build amd64 and arm64 in parallel on native GitHub-hosted machines.
  build-platform:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require native architecture
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Wrong runner architecture"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish proxy digest for ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/lukacek/simple-aiproxy
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=proxy-${{ matrix.arch }}
          cache-to: type=gha,scope=proxy-${{ matrix.arch }},mode=max
      - name: Save image digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Preserve this job name: deployment and status reports depend on it.
  build-and-push:
    needs: build-platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/lukacek/simple-aiproxy
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: proxy-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture latest and SHA tags
        shell: bash
        run: |
          cd "${{ runner.temp }}/digests"
          shopt -s nullglob
          files=(*)
          [[ "${#files[@]}" -eq 2 ]] || { echo "Expected two native build digests"; exit 1; }
          images=()
          for file in "${files[@]}"; do
            [[ "$file" =~ ^[0-9a-f]{64}$ ]] || exit 1
            images+=("${REGISTRY_IMAGE}@sha256:${file}")
          done
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            -t "${REGISTRY_IMAGE}:${GITHUB_SHA}" \
            "${images[@]}"
      - name: Verify both architectures before deployment
        shell: bash
        run: |
          docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:${GITHUB_SHA}" | python3 -c '
          import json, sys
          image = json.load(sys.stdin)
          platforms = {
              (m.get("platform", {}).get("os"), m.get("platform", {}).get("architecture"))
              for m in image.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          print("Published image platforms:", platforms)
          if not required.issubset(platforms):
              sys.exit("Multi-architecture manifest is missing a required platform")
          '

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync production Docker Compose and update script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "server_deployment/docker-compose.yml,server_deployment/update.sh"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH and verify health and admin UI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x update.sh
            ./update.sh

  report:
    needs: [test, build-and-push, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pipeline result
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          git config user.name "SimpleAIProxy Deploy Bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git fetch origin deployment-status
          git switch deployment-status
          REPORTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "${DEPLOY_RESULT}" = "success" ]; then
            STATUS="verified"
            DEPLOYED_SHA="${COMMIT_SHA}"
            FASTAPI_HEALTH=true
            ADMIN_CONFIG_UI=true
          else
            STATUS="failed"
            DEPLOYED_SHA=""
            FASTAPI_HEALTH=false
            ADMIN_CONFIG_UI=false
          fi
          cat > deployment-status.json <<EOF
          {
            "status": "${STATUS}",
            "commit_sha": "${COMMIT_SHA}",
            "deployed_sha": "${DEPLOYED_SHA}",
            "reported_at": "${REPORTED_AT}",
            "workflow_run_url": "https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}",
            "jobs": {
              "test": "${TEST_RESULT}",
              "build_and_push": "${BUILD_RESULT}",
              "deploy": "${DEPLOY_RESULT}"
            },
            "checks": {
              "fastapi_health": ${FASTAPI_HEALTH},
              "admin_config_free_provider_ui": ${ADMIN_CONFIG_UI}
            }
          }
          EOF
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record deployment pipeline ${COMMIT_SHA}"
          git push origin deployment-status
