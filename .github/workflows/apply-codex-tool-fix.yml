name: Apply Codex tool calling fix

on:
  push:
    branches:
      - agent/codex-tool-calling

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-tool-calling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source and test changes
        run: python .github/scripts/apply_codex_tool_calling_fix.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Commit generated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Support Codex Responses tool calling"
          git push
